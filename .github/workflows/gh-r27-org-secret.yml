name: GH-R27 organization secret consumer

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - name: Prove exact secret value through canonical issue
        env:
          CANARY: ${{ secrets.CM_ORG_SECRET_GAMMA_20260730 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$CANARY" = "OWNER-ORG-SECRET-GAMMA-20260730" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "GH-R27 owner org-secret consumer" --body "OWNER-CANARY-CONSUMED-20260730"
          elif [ "$CANARY" = "A-ATTACK-ORG-SECRET-GAMMA-20260730" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "GH-R27 unauthorized org-secret consumer" --body "ATTACK-CANARY-CONSUMED-20260730"
          else
            echo "No recognized canary; no side effect."
          fi
